name: Release plugin

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Test
        run: make check
      - name: Build plugin bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/package-plugin.sh "$version"
          cd dist
          zip -r "tene-codex-$version.zip" "tene-codex-$version"
          shasum -a 256 "tene-codex-$version.zip" > "tene-codex-$version.zip.sha256"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
